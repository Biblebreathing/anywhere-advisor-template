<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>{{ ws_title }} | {{ c.book.title }}</title>
<link rel="stylesheet" href="{{ fonts_url }}">
<link rel="stylesheet" href="../style.css">
<style>
.sheet{max-width:820px;margin:28px auto;background:#fff;padding:44px 48px;border-radius:12px;box-shadow:0 2px 14px rgba(0,0,0,.08)}
.sheet h2{font-size:30px;border-bottom:3px solid var(--accent);padding-bottom:10px}
.sheet table{width:100%;border-collapse:collapse;margin:18px 0}
.sheet th,.sheet td{border:1px solid #999;padding:14px 12px;text-align:left;vertical-align:top;height:48px}
.sheet th{background:var(--primary-tint);color:var(--ink)}
.sheet p{font-size:19px}
.bar{display:flex;justify-content:space-between;align-items:center;max-width:820px;margin:20px auto 0;padding:0 16px;gap:12px;flex-wrap:wrap}
.fine{font-size:12px;color:#555;margin-top:28px;border-top:1px solid #ccc;padding-top:10px}
@media print{ body{background:#fff} .bar{display:none} .sheet{box-shadow:none;margin:0;padding:0;max-width:none} .sheet th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact} }
</style>
</head>
<body>
<div class="bar"><a class="link" href="../index.html{{ back_anchor }}">← Back to the bonus page</a><button class="btn" onclick="window.print()">Print / Save as PDF</button></div>
<main class="sheet">
  <p class="eyebrow">{{ c.book.title }} · {{ s.advisor.name }}</p>
  {{ ws_html | safe }}
  <p class="fine">{{ s.disclosure }}</p>
</main>
</body>
</html>
